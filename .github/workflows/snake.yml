name: Generate GitHub Snake Graph

on:
  schedule:
    # Runs automatically every 24 hours at midnight
    - cron: "0 0 * * *"
  workflow_dispatch:
    # Allows manual trigger from the GitHub Actions UI

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Snake Animation
        uses: Platane/snk@v3
        with:
          github_user_name: Yoseph-GL
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#A855F7&color_dots=#161b22,#4c1d95,#6d28d9,#8b5cf6,#a855f7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to Output Branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout --orphan output 2>/dev/null || git checkout output
          git rm -rf --ignore-unmatch .
          cp dist/github-snake-dark.svg .
          git add github-snake-dark.svg
          git commit -m "Update snake graph" || true
          git push origin output --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
