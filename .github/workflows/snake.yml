name: Generate GitHub Snake Graph

on:
  schedule:
    # Runs automatically every 24 hours at midnight
    - cron: "0 0 * * *"
  workflow_dispatch:
    # Allows manual trigger from the GitHub Actions UI

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Generate Snake Animation
        uses: Platane/snk@v3
        with:
          github_user_name: Yoseph-GL
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#A855F7&color_dots=#161b22,#4c1d95,#6d28d9,#8b5cf6,#a855f7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
